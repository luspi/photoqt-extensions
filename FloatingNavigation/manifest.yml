about:
    version: 1
    name: Floating Navigation
    longName: Show floating navigation buttons
    description: This extension provides floating buttons to navigate between images and to show/hide the main menu.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    name[de]: Schwebende Navigation
    longName[de]: Schwebende Knöpfe zur Navigation anzeigen
    description[de]: Diese Erweiterung stellt schwebende Knöpfe bereit zum Navigieren zwischen den Bildern und zum Ein-/Ausblenden des Hauptmenüs.
    name[es]: Botones de navegación flotantes
    longName[es]: Mostrar botones de navegación flotantes
    description[es]: Esta extensión proporciona botones flotantes para navegar entre imágenes y para mostrar/ocultar el menú principal.
    name[lt]: Slankiojančioji navigacija
    longName[lt]: Rodyti slankiojančiosios navigacijos mygtukus
    description[lt]: Šis plėtinys įgalina slankiojančiuosius mygtukus, skirtus naršyti tarp vaizdų ir rodyti/slėpti pagrindinį meniu.
    name[uk]: Плаваюча Навігація
    longName[uk]: Показувати плаваючі кнопки навігації
    description[uk]: Це розширення забезпечує плаваючі кнопки для навігації між зображеннями і для того щоб показати/приховати головне меню.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0, 0]
        defaultPosition: Bottom
        defaultDistanceFromEdge: 100
        defaultSize: [300, 100]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [300, 100]
        fixSizeToContent: false
    contextmenu: other
    floating: true
    modal: false
    defaultShortcut: Shift+F
    rememberGeometry: false
    customMouseHandling: true
    haveCPPActions: false
