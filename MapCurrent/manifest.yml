about:
    version: 1
    name: Current Map
    longName: Show location on map
    description: This extension show the GPS location of the current image on a small floating map.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    name[de]: Aktuelle Karte
    longName[de]: Standort auf Karte anzeigen
    description[de]: Diese Erweiterung zeigt den GPS-Standort des aktuellen Bildes auf einer kleinen schwebenden Karte an.
    name[es]: Mapa actual
    longName[es]: Mostrar ubicación en el mapa
    description[es]: Esta extensión muestra la ubicación de la imagen actual en un mini-mapa flotante.
    name[uk]: Поточна Мапа
    longName[uk]: Відобразити місцезнаходження на мапі
    description[uk]: Це розширення показує GPS-розташування поточного зображення на невеликій плаваючій карті.
    name[lt]: Lokacija žemėlapyje
    longName[lt]: Rodyti lokaciją žemėlapyje
    description[lt]: Šis plėtinys žemėlapyje rodo vaizdo GPS lokaciją mažame, slankiojančiame langelyje.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0, 0]
        defaultPosition: TopLeft
        defaultDistanceFromEdge: 100
        defaultSize: [300, 200]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [300, 200]
        fixSizeToContent: false
    contextmenu: about
    floating: true
    modal: false
    defaultShortcut: G
    defaultSize: [300, 200]
    rememberGeometry: true
    haveCPPActions: false
