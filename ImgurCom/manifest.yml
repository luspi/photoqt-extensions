about:
    version: 1
    name: imgur.com
    longName: Upload to imgur.com
    description: This extension allows uploading an image to imgur.com. If no account is connected, then the image will be uploaded anonymously.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    longName[de]: Hochladen auf imgur.com
    description[de]: Diese Erweiterung ermöglicht das Hochladen eines Bildes auf imgur.com. Wenn kein Konto verbunden ist, wird das Bild anonym hochgeladen.
    longName[lt]: Įkelti į imgur.com
    description[lt]: Šis plėtinys leidžia įkelti vaizdą į imgur.com. Jei nėra prijungtos paskyros, vaizdas bus įkeltas anonimiškai.
    longName[uk]: Завантажити на imgur.com
    description[uk]: Це розширення дозволяє завантажувати зображення на imgur.com. Якщо обліковий запис не підключений, то зображення буде завантажено анонімно.
    longName[es]: Subir a imgur.com
    description[es]: Esta extensión permite subir imágenes a imgur.com. Si no hay cuenta conectada, la imagen se subirá anónimamente.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [600, 400]
        defaultPosition: ''
        defaultDistanceFromEdge: 100
        defaultSize: [0, 0]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [800, 600]
        fixSizeToContent: false
    contextmenu: ''
    mainmenu: true
    floating: false
    modal: true
    defaultShortcut: Ctrl+I
    rememberGeometry: true
    haveCPPActions: true
    settings:
        - [AccessToken, string, '']
        - [RefreshToken, string, '']
        - [AccountName, string, '']
        - [AuthDateTime, string, '']
