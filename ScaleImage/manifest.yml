about:
    version: 2
    name: Scale Image
    description: This extension allows scaling an image to a different resolution.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    name[uk]: Масштабувати Зображення
    description[uk]: Це розширення дозволяє змінювати роздільну здатність зображення.
    name[es]: Escalar imagen
    description[es]: Esta extensión permite escalar una imagen a otra resolución.
    name[lt]: Keisti vaizdo mastelį
    description[lt]: Šis plėtinys leidžia pakeisti vaizdo skiriamąją gebą.
    name[de]: Bild skalieren
    description[de]: Diese Erweiterung ermöglicht es, ein Bild in eine andere Auflösung zu skalieren.
setup:
    integrated:
        allow: true
        byDefault: false
        minimumRequiredWindowSize: [600, 400]
        defaultPosition: ''
        defaultDistanceFromEdge: 0
        defaultSize: [0, 0]
        fixSizeToContent: false
    popout:
        allow: true
        byDefault: true
        defaultSize: [800, 600]
        fixSizeToContent: false
    contextmenu: manipulate
    floating: false
    modal: true
    defaultShortcut: Ctrl+X
    rememberGeometry: true
    haveCPPActions: true
    settings: []
