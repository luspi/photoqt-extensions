about:
    version: 1
    name: Quick Actions
    longName: Show quick actions buttons
    description: This extension provides various actions that can be accessed with a single click.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 2
    name[de]: Schnellaktionen
    longName[de]: Zeige Knöpfe für verschiedene Aktionen
    description[de]: Diese Erweiterung bietet Knöpfe für verschiedene Aktionen, die mit einem einzigen Klick ausgeführt werden können.
    name[es]: Acciones rápidas
    longName[es]: Mostrar botones de acciones rápidas
    description[es]: Esta extensión proporciona diversas acciones a las que se puede acceder con un solo clic.
    name[uk]: Швидкі Дії
    longName[uk]: Показати кнопки швидких дій
    description[uk]: Це розширення надає різні дії, які можна виконати одним кліком.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0, 0]
        defaultPosition: Top
        defaultDistanceFromEdge: 20
        defaultSize: [0, 0]
        fixSizeToContent: true
    popout:
        allow: true
        defaultSize: [0, 0]
        fixSizeToContent: true
    contextmenu: other
    floating: true
    modal: false
    defaultShortcut: Ctrl+Shift+A
    rememberGeometry: false
    customMouseHandling: true
    haveCPPActions: false
    settings:
        - [Items, list, rename:://::delete:://::|:://::rotateleft:://::rotateright:://::mirrorhor:://::mirrorver:://::|:://::crop:://::scale:://::|:://::close]
