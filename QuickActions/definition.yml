about:
    version: 1
    name: "QuickActions"
    description: "This extension provides various actions that can be accessed with a single click."
    author: "Lukas Spies"
    contact: "Lukas@photoqt.org"
    targetAPI: 1

setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0,0]
        defaultPosition: "Top"
        defaultDistanceFromEdge: 20
        defaultSize: [0,0]
        fixSizeToContent: true
    popout:
        allow: true
        defaultSize: [0,0]
        fixSizeToContent: true
    modal: false
    defaultShortcut: "Ctrl+Shift+A"
    rememberGeometry: false
    letMeHandleMouseEvents: true
    haveCPPActions: false
    settings:
        - ["Items", "list", "rename:://::delete:://::|:://::rotateleft:://::rotateright:://::mirrorhor:://::mirrorver:://::|:://::crop:://::scale:://::|:://::close"]
