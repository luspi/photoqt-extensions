about:
    version: 2
    name: Crop Image
    description: This extension allows cropping an image.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    name[de]: Bild zuschneiden
    description[de]: Diese Erweiterung ermöglicht das Zuschneiden eines Bildes.
    name[es]: Recortar imagen
    description[es]: Esta extensión permite recortar una imagen.
    name[lt]: Kirpti vaizdą
    description[lt]: Šis plėtinys leidžia apkarpyti vaizdą.
    name[uk]: Обрізати Зображення
    description[uk]: Це розширення дозволяє обрізати зображення.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [600, 400]
        defaultPosition: ''
        defaultDistanceFromEdge: 100
        defaultSize: [0, 0]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [800, 600]
        fixSizeToContent: false
    contextmenu: manipulate
    floating: false
    modal: true
    defaultShortcut: Shift+C
    rememberGeometry: true
    haveCPPActions: false
