metainfo:
    version: 1
    name: "Histogram"
    description: "This extension provides a histogram for any viewed image."
    author: "Lukas Spies"
    contact: "Lukas@photoqt.org"
    targetAPI: 1

setup:
    defaultShortcut: "H"

    defaultSize: [300,200]
    positionAt: "TopLeft"
    distanceFromEdge: 100

    minimumRequiredWindowSize: [0,0]
    isModal: false
    allowIntegrated: true
    allowPopout: true
    rememberGeometry: true
    letMeHandleMouseEvents: false

    settings:
        - ["Version", "string", "color"]

    haveCPPActions: true
