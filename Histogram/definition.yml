about:
    version: 1
    name: "Histogram"
    description: "This extension provides a histogram for any viewed image."
    author: "Lukas Spies"
    contact: "Lukas@photoqt.org"
    website: "https://gitlab.com/lspies/photoqt-extensions"
    targetAPI: 1

setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0,0]
        defaultPosition: "TopLeft"
        defaultDistanceFromEdge: 100
        defaultSize: [300,200]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [300,200]
        fixSizeToContent: false
    contextmenu:
        section: "about"
        icon: "histogram.svg"
        title: "Histogram"
    modal: false
    defaultShortcut: "H"
    defaultSize: [300,200]
    rememberGeometry: true
    letMeHandleMouseEvents: false
    haveCPPActions: true
    settings:
        - ["Version", "string", "color"]
