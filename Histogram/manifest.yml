about:
    version: 1
    name: Histogram
    longName: Show histogram
    description: This extension provides a histogram for the currently viewed image.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 3
    name[lt]: Histograma
    longName[lt]: Rodyti histogramą
    description[lt]: Šis plėtinys parodo peržiūrimo vaizdo histogramą.
    name[uk]: Гістограма
    longName[uk]: Показати гістограму
    description[uk]: Це розширення надає гістограму для зображення, яке наразі переглядається.
    name[es]: Histograma
    longName[es]: Mostrar histograma
    description[es]: Esta extensión muestra un histograma de la imagen mostrada.
    name[de]: Histogramm
    longName[de]: Histogramm anzeigen
    description[de]: Diese Erweiterung zeigt ein Histogramm für das aktuell angezeigte Bild an.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [0, 0]
        defaultPosition: TopLeft
        defaultDistanceFromEdge: 100
        defaultSize: [300, 200]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [300, 200]
        fixSizeToContent: false
    contextmenu: about
    floating: true
    modal: false
    defaultShortcut: H
    defaultSize: [300, 200]
    rememberGeometry: true
    haveCPPActions: true
    settings:
        - [Version, string, color]
