metainfo:
    version: 1
    name: "Export Image"
    description: "This extension allows exporting an image to another format."
    author: "Lukas Spies"
    contact: "Lukas@photoqt.org"
    targetAPI: 1

setup:
    defaultShortcut: "Ctrl+S"

    defaultSize: [800,600]
    minimumRequiredWindowSize: [600,400]
    fullscreenModal: true

    allowIntegrated: true
    allowPopout: true
    letMeHandleMouseEvents: true

    settings:
        - ["Favorites", "list", "11485:://::46215:://::28282:://::44462"]
        - ["LastUsed", "string", ""]

    haveCPPActions: true
