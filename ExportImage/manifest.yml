about:
    version: 1
    name: Export Image
    description: This extension allows exporting an image to another format.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 2
    name[de]: Bild exportieren
    description[de]: Diese Erweiterung ermöglicht das Exportieren eines Bildes in ein anderes Format.
    name[es]: Exportar imagen
    description[es]: Esta extensión permite exportar una imagen a otro formato.
    name[lt]: Eksportuoti vaizdą
    description[lt]: Šis plėtinys leidžia eksportuoti vaizdą kitu formatu.
    name[uk]: Експорт Зображення
    description[uk]: Це розширення дозволяє експортувати зображення в інший формат.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [600, 400]
        defaultPosition: ''
        defaultDistanceFromEdge: 100
        defaultSize: [0, 0]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [800, 600]
        fixSizeToContent: false
    contextmenu: manipulate
    floating: false
    modal: true
    defaultShortcut: Ctrl+S
    rememberGeometry: true
    haveCPPActions: true
    settings:
        - [Favorites, list, 11485:://::46215:://::28282:://::44462]
        - [LastUsed, string, '']
