about:
    version: 1
    name: Wallpaper
    longName: Set as Wallpaper
    description: This extension allows setting an image as wallpaper.
    author: Lukas Spies
    contact: Lukas@photoqt.org
    website: https://gitlab.com/lspies/photoqt-extensions
    targetAPI: 2
    name[de]: Hintergrundbild
    longName[de]: Als Hintergrund setzen
    description[de]: Diese Erweiterung ermöglicht es, ein Bild als Hintergrund zu setzen.
    name[es]: Fondo de escritorio
    longName[es]: Establecer como fondo de escritorio
    description[es]: Esta extensión permite establecer una imagen como fondo de pantalla.
    name[lt]: Darbalaukio fonas
    longName[lt]: Nustatyti kaip darbalaukio foną
    description[lt]: Šis plėtinys leidžia nustatyti paveikslėlį darbalaukio fonu.
    name[uk]: Шпалери
    longName[uk]: Встановити як Шпалери
    description[uk]: Це розширення дозволяє встановлювати зображення як шпалери.
setup:
    integrated:
        allow: true
        minimumRequiredWindowSize: [600, 400]
        defaultPosition: ''
        defaultDistanceFromEdge: 100
        defaultSize: [0, 0]
        fixSizeToContent: false
    popout:
        allow: true
        defaultSize: [800, 600]
        fixSizeToContent: false
    contextmenu: use
    floating: false
    modal: true
    defaultShortcut: W
    rememberGeometry: true
    haveCPPActions: true
